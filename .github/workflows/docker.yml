name: Docker CI/CD

on:
  push:
    branches: [main, refactor]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          image="$(echo "${IMAGE_NAME}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')"
          docker build --file Dockerfile --tag "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Push immutable image
        if: github.event_name == 'push'
        run: docker push "$IMAGE"

      - name: Tag and push branch image
        if: github.event_name == 'push'
        run: |
          branch_tag="$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g')"
          tag="$(echo "${IMAGE_NAME}:$branch_tag" | tr '[:upper:]' '[:lower:]')"
          docker tag "$IMAGE" "$tag"
          docker push "$tag"

      - name: Tag and push latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          latest="$(echo "${IMAGE_NAME}:latest" | tr '[:upper:]' '[:lower:]')"
          docker tag "$IMAGE" "$latest"
          docker push "$latest"
